<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MultiTool French</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>MultiTool <span>French</span></h1>
    <nav class="tabs" role="tablist">
      <button class="tab active" role="tab" aria-selected="true" data-tab="translate">Переводчик</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="transcribe">Расшифровка</button>
    </nav>
  </header>

  <main>
    <section id="tab-translate" class="panel">
      <div class="toolbar">
        <div class="direction" role="radiogroup" aria-label="Направление перевода">
          <button class="dir active" data-dir="auto">Авто</button>
          <button class="dir" data-dir="fr-ru">FR → RU</button>
          <button class="dir" data-dir="ru-fr">RU → FR</button>
        </div>
        <span id="detected" class="hint"></span>
      </div>

      <div class="columns">
        <div class="box">
          <textarea id="source" placeholder="Вставьте текст на французском или русском…" maxlength="20000"></textarea>
          <div class="box-footer">
            <span id="counter" class="hint">0 / 20 000</span>
            <button id="clear" class="ghost">Очистить</button>
          </div>
        </div>
        <div class="box">
          <div id="result" class="result" aria-live="polite"></div>
          <div class="box-footer">
            <span class="hint">Ctrl + Enter — перевести</span>
            <div class="footer-buttons">
              <button id="summary-btn" class="ghost" disabled>Конспект</button>
              <button id="copy" class="ghost" disabled>Копировать</button>
            </div>
          </div>
        </div>
      </div>

      <div class="actions">
        <button id="translate" class="primary">Перевести</button>
      </div>
      <p id="error" class="error" role="alert" hidden></p>
      <div id="summary-translate" class="summary" hidden></div>
    </section>

    <section id="tab-transcribe" class="panel" hidden>
      <div id="upload-view">
        <div class="lang-row">
          <label for="language">Язык записи:</label>
          <select id="language">
            <option value="auto">Определить автоматически</option>
            <option value="fr">Французский</option>
            <option value="en">Английский</option>
            <option value="es">Испанский</option>
            <option value="it">Итальянский</option>
            <option value="de">Немецкий</option>
            <option value="pt">Португальский</option>
            <option value="ru">Русский</option>
            <option value="uk">Украинский</option>
          </select>
        </div>
        <label id="dropzone" class="dropzone">
          <input type="file" id="file-input" accept="audio/*,video/*" hidden>
          <strong>Перетащите аудио или видео сюда</strong>
          <span class="hint">или нажмите, чтобы выбрать файл · mp3, m4a, wav, ogg, mp4, mov, mkv…</span>
        </label>
        <p class="hint center">Получите расшифровку с переводом на русский и скачаете её в TXT.
          Если язык определился неправильно, выберите его вручную.</p>
        <p id="upload-error" class="error" role="alert" hidden></p>
      </div>

      <div id="job-view" hidden>
        <div class="job-head">
          <div class="job-info">
            <div id="job-file" class="job-file"></div>
            <div id="job-stage" class="hint" aria-live="polite"></div>
          </div>
          <div class="job-actions">
            <button id="job-summary-btn" class="ghost" disabled>Конспект</button>
            <button id="download" class="primary" disabled>Скачать TXT</button>
            <button id="new-file" class="ghost">Новый файл</button>
          </div>
        </div>
        <div class="progress" aria-hidden="true"><div id="progress-bar"></div></div>
        <p id="job-note" class="hint">Держите вкладку открытой до конца обработки. Если случайно закрыли — откройте сайт снова, и прогресс подхватится.</p>
        <p id="job-error" class="error" role="alert" hidden></p>
        <div id="summary-job" class="summary" hidden></div>
        <div id="transcript" class="transcript"></div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
